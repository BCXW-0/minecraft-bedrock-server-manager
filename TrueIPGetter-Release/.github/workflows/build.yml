on:
  pull_request:
  push:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: self-hosted
    strategy:
      matrix:
        target_type:
          - server
    steps:
      - uses: actions/checkout@v6


      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m release -p windows -v -y

      - run: |
          xmake -v -y

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-${{ matrix.target_type }}-windows-x64
          path: |
            bin/
